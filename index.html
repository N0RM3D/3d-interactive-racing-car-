<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upgraded Mobile Hand-Steering Racer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose"></script>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body { margin: 0; background: #070714; font-family: -apple-system, sans-serif; overflow: hidden; color: #fff; }
        #canvas3d { position: absolute; width: 100%; height: 100%; z-index: 1; }
        
        /* HUD Style */
        #hud { position: absolute; top: 15px; left: 0; width: 100%; z-index: 10; display: flex; justify-content: space-between; padding: 0 20px; pointer-events: none; }
        .hud-card { background: rgba(10, 10, 30, 0.85); padding: 8px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5px); text-align: center; }
        .label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #8a8ab0; margin-bottom: 2px; }
        .value { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
        #speedVal { color: #ffcc00; text-shadow: 0 0 10px rgba(255,204,0,0.4); }
        
        /* Camera Window */
        #cam-container { position: absolute; bottom: 20px; right: 20px; width: 90px; height: 120px; border-radius: 16px; overflow: hidden; border: 2px solid #3b3b5c; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 10; background: #000; }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        /* Interactive Speed Control Buttons */
        #controls { position: absolute; bottom: 20px; left: 20px; z-index: 10; display: flex; gap: 15px; }
        .btn { width: 70px; height: 70px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; color: #fff; background: rgba(15, 15, 35, 0.8); backdrop-filter: blur(5px); box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; pointer-events: auto; }
        .btn:active { transform: scale(0.92); }
        #btn-gas { border-color: #00ffcc; text-shadow: 0 0 5px #00ffcc; }
        #btn-gas.active { background: rgba(0, 255, 204, 0.3); }
        #btn-brake { border-color: #ff3366; text-shadow: 0 0 5px #ff3366; }
        #btn-brake.active { background: rgba(255, 51, 102, 0.3); }

        /* Pause Button */
        #btn-pause { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 70px; height: 70px; z-index: 10; pointer-events: auto; }
        #btn-pause-icon { font-size: 28px; }

        /* Score Display */
        #score-display { position: absolute; top: 100px; right: 20px; background: rgba(10, 10, 30, 0.85); padding: 15px 20px; border-radius: 12px; border: 1px solid rgba(0, 255, 204, 0.3); z-index: 10; text-align: right; }
        #score-display .score-label { font-size: 10px; color: #8a8ab0; margin-bottom: 5px; }
        #score-display .score-value { font-size: 24px; color: #00ffcc; font-weight: bold; }

        /* Pause Menu Overlay */
        #pause-menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .pause-content { background: rgba(10, 10, 30, 0.95); padding: 40px 30px; border-radius: 20px; border: 2px solid rgba(0, 255, 204, 0.4); text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
        .pause-content h2 { font-size: 2rem; margin-bottom: 30px; color: #00ffcc; text-shadow: 0 0 15px rgba(0, 255, 204, 0.5); }
        .pause-stats { margin: 20px 0; font-size: 1.1rem; color: #b0b0b0; }
        .pause-stats p { margin: 8px 0; }
        .pause-stat-label { color: #8a8ab0; font-size: 0.9rem; }
        .pause-stat-value { color: #00ffcc; font-weight: bold; font-size: 1.3rem; }
        .pause-buttons { display: flex; gap: 15px; margin-top: 30px; justify-content: center; }
        .pause-btn { padding: 15px 30px; border: 2px solid rgba(255,255,255,0.2); border-radius: 15px; font-size: 1rem; font-weight: bold; background: rgba(15, 15, 35, 0.8); color: #fff; cursor: pointer; transition: all 0.3s ease; }
        .pause-btn:hover { transform: scale(1.05); }
        #btn-resume { border-color: #00ffcc; color: #00ffcc; }
        #btn-resume:hover { background: rgba(0, 255, 204, 0.2); }
        #btn-quit { border-color: #ff3366; color: #ff3366; }
        #btn-quit:hover { background: rgba(255, 51, 102, 0.2); }

        /* Welcome Loading Screen */
        #status-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7,7,20,0.95); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; transition: opacity 0.5s ease; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #ffcc00; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #btn-start { display: none; margin-top: 20px; background: #ffcc00; color: #000; border: none; padding: 14px 35px; font-size: 16px; font-weight: bold; border-radius: 30px; box-shadow: 0 5px 15px rgba(255,204,0,0.4); cursor: pointer; }
        #btn-start:hover { background: #ffdd33; transform: scale(1.05); }
    </style>
</head>
<body>

<div id="status-overlay">
    <div class="spinner" id="loader"></div>
    <h2 id="status-txt">Loading Vision Engine...</h2>
    <p style="color: #8a8ab0; font-size: 14px; max-width: 280px; margin: 8px 0 0 0;" id="status-desc">Starting system graphics and tracking layers.</p>
    <button id="btn-start">START RACING</button>
</div>

<div id="pause-menu">
    <div class="pause-content">
        <h2>⏸️ PAUSED</h2>
        <div class="pause-stats">
            <p><span class="pause-stat-label">Current Speed:</span></p>
            <p class="pause-stat-value"><span id="pause-speed">0</span> KM/H</p>
            <p style="margin-top: 15px;"><span class="pause-stat-label">Distance Traveled:</span></p>
            <p class="pause-stat-value"><span id="pause-distance">0</span> m</p>
        </div>
        <div class="pause-buttons">
            <button class="pause-btn" id="btn-resume">▶ RESUME</button>
            <button class="pause-btn" id="btn-quit">⏹️ QUIT</button>
        </div>
    </div>
</div>

<div id="hud">
    <div class="hud-card">
        <div class="label">Speed</div>
        <div class="value"><span id="speedVal">0</span> KM/H</div>
    </div>
    <div class="hud-card">
        <div class="label">Steer Control</div>
        <div class="value" id="steerLabel" style="font-size: 14px; margin-top: 5px; color: #00ffcc;">CENTER</div>
    </div>
</div>

<div class="btn" id="btn-pause" style="border-color: #ffcc00; text-shadow: 0 0 5px #ffcc00;">
    <div id="btn-pause-icon">⏸️</div>
</div>

<div id="score-display">
    <div class="score-label">DISTANCE</div>
    <div class="score-value" id="score-value">0 m</div>
</div>

<div id="controls">
    <div class="btn" id="btn-brake">🛑<br>BRAKE</div>
    <div class="btn" id="btn-gas">⚡<br>GAS</div>
</div>

<div id="cam-container">
    <video id="webcam" autoplay playsinline muted></video>
</div>

<canvas id="canvas3d"></canvas>

<script>
    const canvas = document.getElementById('canvas3d');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('webcam');
    const overlay = document.getElementById('status-overlay');
    const statusTxt = document.getElementById('status-txt');
    const statusDesc = document.getElementById('status-desc');
    const loader = document.getElementById('loader');
    const btnStart = document.getElementById('btn-start');
    const speedVal = document.getElementById('speedVal');
    const steerLabel = document.getElementById('steerLabel');
    const btnGas = document.getElementById('btn-gas');
    const btnBrake = document.getElementById('btn-brake');
    const scoreValue = document.getElementById('score-value');
    const btnPause = document.getElementById('btn-pause');
    const pauseMenu = document.getElementById('pause-menu');
    const btnResume = document.getElementById('btn-resume');
    const btnQuit = document.getElementById('btn-quit');
    const pauseSpeed = document.getElementById('pause-speed');
    const pauseDistance = document.getElementById('pause-distance');

    const MOBILE_FRAME_SKIP = 2; 
    let frameCount = 0;

    // Movement & Tracking System
    let carX = 0;
    let targetCarX = 0;
    let visualWheelRotation = 0; 
    let currentSpeed = 100;
    let targetSpeed = 100;
    let roadDistance = 0;
    let handTrackerModel = null;
    let isGameRunning = false;
    let isGamePaused = false;
    let totalDistance = 0;

    // Button Input Trackers
    let isPressingGas = false;
    let isPressingBrake = false;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Speed Controls Event Listeners
    btnGas.addEventListener('touchstart', (e) => { e.preventDefault(); if (!isGamePaused) { isPressingGas = true; btnGas.classList.add('active'); } });
    btnGas.addEventListener('touchend', (e) => { e.preventDefault(); isPressingGas = false; btnGas.classList.remove('active'); });
    btnGas.addEventListener('mousedown', () => { if (!isGamePaused) { isPressingGas = true; btnGas.classList.add('active'); } });
    btnGas.addEventListener('mouseup', () => { isPressingGas = false; btnGas.classList.remove('active'); });
    
    btnBrake.addEventListener('touchstart', (e) => { e.preventDefault(); if (!isGamePaused) { isPressingBrake = true; btnBrake.classList.add('active'); } });
    btnBrake.addEventListener('touchend', (e) => { e.preventDefault(); isPressingBrake = false; btnBrake.classList.remove('active'); });
    btnBrake.addEventListener('mousedown', () => { if (!isGamePaused) { isPressingBrake = true; btnBrake.classList.add('active'); } });
    btnBrake.addEventListener('mouseup', () => { isPressingBrake = false; btnBrake.classList.remove('active'); });

    // Pause Button Handler
    btnPause.addEventListener('click', () => {
        if (isGameRunning) {
            isGamePaused = !isGamePaused;
            if (isGamePaused) {
                pauseMenu.style.display = 'flex';
                pauseSpeed.textContent = Math.floor(currentSpeed);
                pauseDistance.textContent = Math.floor(totalDistance);
            } else {
                pauseMenu.style.display = 'none';
            }
        }
    });

    // Resume Button
    btnResume.addEventListener('click', () => {
        isGamePaused = false;
        pauseMenu.style.display = 'none';
    });

    // Quit Button
    btnQuit.addEventListener('click', () => {
        isGameRunning = false;
        isGamePaused = false;
        pauseMenu.style.display = 'none';
        overlay.style.opacity = "1";
        overlay.style.display = "flex";
        loader.style.display = "none";
        statusTxt.innerText = "Game Over!";
        statusDesc.innerText = `You traveled ${Math.floor(totalDistance)}m. Click START RACING to play again.`;
        btnStart.style.display = "block";
    });

    async function startMobileCamera() {
        try {
            const constraints = {
                video: { facingMode: "user", width: { ideal: 256 }, height: { ideal: 192 } },
                audio: false
            };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            return new Promise((resolve) => { video.onloadedmetadata = () => { video.play(); resolve(video); }; });
        } catch (err) {
            statusTxt.innerText = "Camera Blocked";
            statusDesc.innerText = "Please unlock camera access settings to play.";
            loader.style.display = "none";
            throw err;
        }
    }

    async function initMobileAI() {
        try {
            await startMobileCamera();
            statusTxt.innerText = "Optimizing Performance...";
            statusDesc.innerText = "Configuring local GPU settings on your device.";
            
            await tf.ready();
            handTrackerModel = await handpose.load();
            
            loader.style.display = "none";
            statusTxt.innerText = "Ready To Play!";
            statusDesc.innerText = "Place phone on a stand. Step back so your face and hands fit inside the frame.";
            btnStart.style.display = "block";
            
            btnStart.addEventListener('click', () => {
                overlay.style.opacity = "0";
                setTimeout(() => { overlay.style.display = "none"; }, 500);
                isGameRunning = true;
                isGamePaused = false;
                totalDistance = 0;
                currentSpeed = 100;
                processWebcamLoop();
            });
        } catch (e) { console.error(e); }
    }

    async function processWebcamLoop() {
        if (!isGameRunning) return;
        frameCount++;

        if (frameCount % MOBILE_FRAME_SKIP === 0 && !isGamePaused) {
            try {
                const handsDetected = await handTrackerModel.estimateHands(video);
                
                if (handsDetected.length >= 1) {
                    const landmarks = handsDetected[0].landmarks;
                    
                    // Core point values to track wrist tilting geometry
                    const wrist = landmarks[0];
                    const middleFingerBase = landmarks[9];
                    
                    const dx = middleFingerBase[0] - wrist[0];
                    const dy = middleFingerBase[1] - wrist[1];
                    
                    // Math angle formula for stable wrist steering tilt calibration
                    let angle = Math.atan2(dx, -dy);
                    
                    // Deadzone to prevent jittery center shaking
                    if (Math.abs(angle) < 0.08) angle = 0;

                    visualWheelRotation = angle * 1.5; 
                    targetCarX = -angle * 320; 

                    if (targetCarX > 30) {
                        steerLabel.innerText = "◀ STEERING LEFT";
                        steerLabel.style.color = "#ff3366";
                    } else if (targetCarX < -30) {
                        steerLabel.innerText = "STEERING RIGHT ▶";
                        steerLabel.style.color = "#00ffcc";
                    } else {
                        steerLabel.innerText = "● STRAIGHT ●";
                        steerLabel.style.color = "#ffffff";
                    }
                } else {
                    // Smooth wheel return to center when hands are dropped
                    visualWheelRotation += (0 - visualWheelRotation) * 0.1;
                    targetCarX += (0 - targetCarX) * 0.1;
                }
            } catch (err) {}
        }
        requestAnimationFrame(processWebcamLoop);
    }

    function drawCyberCar(ctx, x, y, width) {
        const height = width * 0.5;
        ctx.save();
        ctx.translate(x, y);

        // Ground Neon Shadow Glow
        ctx.fillStyle = 'rgba(0, 255, 204, 0.25)';
        ctx.shadowColor = '#00ffcc';
        ctx.shadowBlur = 15;
        ctx.fillRect(-width/2 - 10, height - 5, width + 20, 15);
        ctx.shadowBlur = 0;

        // Cyber Body
        ctx.fillStyle = '#ffcc00';
        ctx.shadowColor = '#ffcc00';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.moveTo(-width/2, height * 0.3);
        ctx.lineTo(-width/2 + 10, -height * 0.2);
        ctx.lineTo(width/2 - 10, -height * 0.2);
        ctx.lineTo(width/2, height * 0.3);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Windows
        ctx.fillStyle = '#00ffff';
        ctx.fillRect(-width/3, -height * 0.15, width/3, height * 0.2);
        ctx.fillRect(0, -height * 0.15, width/3, height * 0.2);

        // Wheels
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(-width/3, height * 0.25, width * 0.12, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(width/3, height * 0.25, width * 0.12, 0, Math.PI * 2);
        ctx.fill();

        // Wheel Rims
        ctx.strokeStyle = '#ff3366';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(-width/3, height * 0.25, width * 0.08, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(width/3, height * 0.25, width * 0.08, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
    }

    function renderRacetrack() {
        const w = canvas.width;
        const h = canvas.height;
        const horizon = h * 0.45;

        ctx.fillStyle = '#060612';
        ctx.fillRect(0, 0, w, h);

        if (isGameRunning && !isGamePaused) {
            carX += (targetCarX - carX) * 0.12;
            
            // Speed control with gas/brake
            if (isPressingGas) {
                targetSpeed = Math.min(targetSpeed + 5, 250);
            } else if (isPressingBrake) {
                targetSpeed = Math.max(targetSpeed - 8, 50);
            } else {
                targetSpeed = 120;
            }
            
            currentSpeed += (targetSpeed - currentSpeed) * 0.08;
            roadDistance += currentSpeed * 0.04;
            totalDistance += currentSpeed * 0.04;
            
            speedVal.innerText = Math.floor(currentSpeed);
            scoreValue.innerText = Math.floor(totalDistance) + ' m';
        }

        const segments = 22;
        for (let i = segments; i > 0; i--) {
            let z = i / segments;
            let nextZ = (i - 1) / segments;

            let y1 = horizon + (1 - z) * (h - horizon);
            let y2 = horizon + (1 - nextZ) * (h - horizon);

            let projectionScale1 = (1 - z);
            let projectionScale2 = (1 - nextZ);

            let curveOffset = Math.sin((roadDistance * 0.008) + (z * 2.2)) * 70;
            let nextCurveOffset = Math.sin((roadDistance * 0.008) + (nextZ * 2.2)) * 70;

            let roadWidth1 = (w * 0.38) * projectionScale1 + 15;
            let roadWidth2 = (w * 0.38) * projectionScale2 + 15;

            let centerX1 = w / 2 + curveOffset + (carX * projectionScale1);
            let centerX2 = w / 2 + nextCurveOffset + (carX * projectionScale2);

            if (Math.floor(roadDistance + i) % 2 === 0) {
                ctx.fillStyle = 'rgba(25, 18, 56, 0.4)';
                ctx.beginPath();
                ctx.moveTo(centerX1 - roadWidth1, y1);
                ctx.lineTo(centerX1 + roadWidth1, y1);
                ctx.lineTo(centerX2 + roadWidth2, y2);
                ctx.lineTo(centerX2 - roadWidth2, y2);
                ctx.fill();

                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 3 * projectionScale1 + 0.5;
                ctx.beginPath(); 
                ctx.moveTo(centerX1 - roadWidth1, y1); 
                ctx.lineTo(centerX2 - roadWidth2, y2); 
                ctx.stroke();
                ctx.strokeStyle = '#ff3366';
                ctx.beginPath(); 
                ctx.moveTo(centerX1 + roadWidth1, y1); 
                ctx.lineTo(centerX2 + roadWidth2, y2); 
                ctx.stroke();
            }
        }

        const carW = w * 0.24 > 110 ? 110 : w * 0.24;
        const playerX = w / 2 - carW / 2;
        const playerY = h * 0.78;

        drawCyberCar(ctx, playerX, playerY, carW);
    }

    function gameLoop() {
        renderRacetrack();
        requestAnimationFrame(gameLoop);
    }

    initMobileAI();
    gameLoop();
</script>

</body>
</html>
