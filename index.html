<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Hand-Steering Racer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose"></script>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body { margin: 0; background: #070714; font-family: -apple-system, sans-serif; overflow: hidden; color: #fff; }
        #canvas3d { position: absolute; width: 100%; height: 100%; z-index: 1; }
        #hud { position: absolute; top: 15px; left: 0; width: 100%; z-index: 10; display: flex; justify-content: space-between; padding: 0 20px; pointer-events: none; }
        .hud-card { background: rgba(10, 10, 30, 0.75); padding: 8px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5px); text-align: center; }
        .label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #8a8ab0; margin-bottom: 2px; }
        .value { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
        #speedVal { color: #ffcc00; text-shadow: 0 0 10px rgba(255,204,0,0.4); }
        #cam-container { position: absolute; bottom: 20px; right: 20px; width: 90px; height: 120px; border-radius: 16px; overflow: hidden; border: 2px solid #3b3b5c; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 10; background: #000; }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #status-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7,7,20,0.95); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; transition: opacity 0.5s ease; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #ffcc00; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #btn-start { display: none; margin-top: 20px; background: #ffcc00; color: #000; border: none; padding: 14px 35px; font-size: 16px; font-weight: bold; border-radius: 30px; box-shadow: 0 5px 15px rgba(255,204,0,0.4); cursor: pointer; }
        #btn-start:hover { background: #ffdd33; }
    </style>
</head>
<body>

<div id="status-overlay">
    <div class="spinner" id="loader"></div>
    <h2 id="status-txt">Loading Vision Engine...</h2>
    <p style="color: #8a8ab0; font-size: 14px; max-width: 280px; margin: 8px 0 0 0;" id="status-desc">Downloading tracking packages directly to your browser.</p>
    <button id="btn-start">START RACING</button>
</div>

<div id="hud">
    <div class="hud-card">
        <div class="label">Speed</div>
        <div class="value"><span id="speedVal">0</span></div>
    </div>
    <div class="hud-card">
        <div class="label">Steer Control</div>
        <div class="value" id="steerLabel" style="font-size: 14px; margin-top: 5px; color: #00ffcc;">CENTER</div>
    </div>
</div>

<div id="cam-container">
    <video id="webcam" autoplay playsinline muted></video>
</div>

<canvas id="canvas3d"></canvas>

<script>
    const canvas = document.getElementById('canvas3d');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('webcam');
    const overlay = document.getElementById('status-overlay');
    const statusTxt = document.getElementById('status-txt');
    const statusDesc = document.getElementById('status-desc');
    const loader = document.getElementById('loader');
    const btnStart = document.getElementById('btn-start');
    const speedVal = document.getElementById('speedVal');
    const steerLabel = document.getElementById('steerLabel');

    const MOBILE_FRAME_SKIP = 2; 
    let frameCount = 0;

    let carX = 0;
    let targetCarX = 0;
    let rawSteerAngle = 0;
    let currentSpeed = 185;
    let roadDistance = 0;
    let handTrackerModel = null;
    let isGameRunning = false;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    async function startMobileCamera() {
        try {
            const constraints = {
                video: {
                    facingMode: "user",
                    width: { ideal: 256 },
                    height: { ideal: 192 }
                },
                audio: false
            };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    video.play();
                    resolve(video);
                };
            });
        } catch (err) {
            statusTxt.innerText = "Camera Blocked";
            statusDesc.innerText = "Please allow camera access and refresh this window to play.";
            loader.style.display = "none";
            throw err;
        }
    }

    async function initMobileAI() {
        try {
            await startMobileCamera();
            statusTxt.innerText = "Optimizing Performance...";
            statusDesc.innerText = "Configuring local GPU settings on your device.";
            
            await tf.ready();
            handTrackerModel = await handpose.load();
            
            loader.style.display = "none";
            statusTxt.innerText = "Ready To Play!";
            statusDesc.innerText = "Place phone on a stand. Step back so your face and hands fit inside the frame.";
            btnStart.style.display = "block";
            
            btnStart.addEventListener('click', () => {
                overlay.style.opacity = "0";
                setTimeout(() => { overlay.style.display = "none"; }, 500);
                isGameRunning = true;
                processWebcamLoop();
            });

        } catch (e) {
            console.error(e);
            statusTxt.innerText = "Error Loading AI Model";
            statusDesc.innerText = "Check your internet connection and try refreshing.";
            loader.style.display = "none";
        }
    }

    async function processWebcamLoop() {
        if (!isGameRunning) return;

        frameCount++;
        if (frameCount % MOBILE_FRAME_SKIP === 0) {
            try {
                const handsDetected = await handTrackerModel.estimateHands(video);
                
                if (handsDetected.length >= 1) {
                    const singlePalmX = handsDetected[0].landmarks[0][0];
                    const normalizedX = (singlePalmX - 128) / 128;
                    targetCarX = -normalizedX * 300;
                    
                    if (targetCarX > 40) {
                        steerLabel.innerText = "◀ TURN LEFT";
                        steerLabel.style.color = "#ff3366";
                    } else if (targetCarX < -40) {
                        steerLabel.innerText = "TURN RIGHT ▶";
                        steerLabel.style.color = "#00ffcc";
                    } else {
                        steerLabel.innerText = "● STABLE ●";
                        steerLabel.style.color = "#ffffff";
                    }
                }
            } catch (err) {
                // Skips empty frames safely
            }
        }

        requestAnimationFrame(processWebcamLoop);
    }

    function renderRacetrack() {
        const w = canvas.width;
        const h = canvas.height;
        const horizon = h * 0.45;

        ctx.fillStyle = '#060612';
        ctx.fillRect(0, 0, w, h);

        if (isGameRunning) {
            carX += (targetCarX - carX) * 0.12;
            roadDistance += currentSpeed * 0.04;
            speedVal.innerText = Math.floor(currentSpeed + Math.sin(Date.now() * 0.012) * 2) + " KM/H";
        }

        const segments = 22;
        for (let i = segments; i > 0; i--) {
            let z = i / segments;
            let nextZ = (i - 1) / segments;

            let y1 = horizon + (1 - z) * (h - horizon);
            let y2 = horizon + (1 - nextZ) * (h - horizon);

            let projectionScale1 = (1 - z);
            let projectionScale2 = (1 - nextZ);

            let curveOffset = Math.sin((roadDistance * 0.008) + (z * 2.2)) * 70;
            let nextCurveOffset = Math.sin((roadDistance * 0.008) + (nextZ * 2.2)) * 70;

            let roadWidth1 = (w * 0.38) * projectionScale1 + 15;
            let roadWidth2 = (w * 0.38) * projectionScale2 + 15;

            let centerX1 = w / 2 + curveOffset + (carX * projectionScale1);
            let centerX2 = w / 2 + nextCurveOffset + (carX * projectionScale2);

            if (Math.floor(roadDistance + i) % 2 === 0) {
                ctx.fillStyle = 'rgba(25, 18, 56, 0.4)';
                ctx.beginPath();
                ctx.moveTo(centerX1 - roadWidth1, y1);
                ctx.lineTo(centerX1 + roadWidth1, y1);
                ctx.lineTo(centerX2 + roadWidth2, y2);
                ctx.lineTo(centerX2 - roadWidth2, y2);
                ctx.fill();

                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 3 * projectionScale1 + 0.5;
                ctx.beginPath(); ctx.moveTo(centerX1 - roadWidth1, y1); ctx.lineTo(centerX2 - roadWidth2, y2); ctx.stroke();
                ctx.strokeStyle = '#ff3366';
                ctx.beginPath(); ctx.moveTo(centerX1 + roadWidth1, y1); ctx.lineTo(centerX2 + roadWidth2, y2); ctx.stroke();
            }
        }

        const carW = w * 0.24 > 110 ? 110 : w * 0.24;
        const carH = carW * 0.55;
        const playerX = w / 2 - carW / 2;
        const playerY = h * 0.78;

        ctx.fillStyle = '#ffcc00';
        ctx.shadowColor = '#ffcc00';
        ctx.shadowBlur = 15;
        ctx.fillRect(playerX, playerY, carW, carH);
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#ff0055';
        ctx.fillRect(playerX + 6, playerY + 4, carW * 0.2, carH * 0.2);
        ctx.fillRect(playerX + carW - (carW * 0.2) - 6, playerY + 4, carW * 0.2, carH * 0.2);
    }

    function gameLoop() {
        renderRacetrack();
        requestAnimationFrame(gameLoop);
    }

    initMobileAI();
    gameLoop();
</script>

</body>
</html>
