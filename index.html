<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1:1 Neon Steering Match Racer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose"></script>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body { margin: 0; background: #070714; font-family: -apple-system, sans-serif; overflow: hidden; color: #fff; }
        #canvas3d { position: absolute; width: 100%; height: 100%; z-index: 1; }
        
        /* HUD Layout */
        #hud { position: absolute; top: 15px; left: 0; width: 100%; z-index: 10; display: flex; justify-content: space-between; padding: 0 20px; pointer-events: none; }
        .hud-card { background: rgba(10, 10, 30, 0.85); padding: 8px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5px); text-align: center; }
        .label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #8a8ab0; margin-bottom: 2px; }
        .value { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
        #speedVal { color: #ffcc00; text-shadow: 0 0 10px rgba(255,204,0,0.4); }
        #distanceVal { color: #00ffcc; }
        
        /* Selfie View and Overlaid Skeleton Setup */
        #cam-container { position: absolute; bottom: 20px; right: 20px; width: 120px; height: 90px; border-radius: 16px; overflow: hidden; border: 2px solid #3b3b5c; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 10; background: #000; }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); position: absolute; top:0; left:0; }
        #overlay-canvas { width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 11; transform: scaleX(-1); }
        
        /* Input Pads */
        #controls { position: absolute; bottom: 20px; left: 20px; z-index: 10; display: flex; gap: 15px; }
        .btn { width: 70px; height: 70px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; color: #fff; background: rgba(15, 15, 35, 0.8); backdrop-filter: blur(5px); box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; pointer-events: auto; }
        .btn:active { transform: scale(0.92); }
        #btn-gas { border-color: #00ffcc; text-shadow: 0 0 5px #00ffcc; }
        #btn-gas.active { background: rgba(0, 255, 204, 0.3); }
        #btn-brake { border-color: #ff3366; text-shadow: 0 0 5px #ff3366; }
        #btn-brake.active { background: rgba(255, 51, 102, 0.3); }

        /* Loader */
        #status-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7,7,20,0.95); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; transition: opacity 0.5s ease; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #ffcc00; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #btn-start { display: none; margin-top: 20px; background: #ffcc00; color: #000; border: none; padding: 14px 35px; font-size: 16px; font-weight: bold; border-radius: 30px; box-shadow: 0 5px 15px rgba(255,204,0,0.4); cursor: pointer; }
        #btn-start:hover { background: #ffdd33; transform: scale(1.05); }
        
        #loading-progress { display: none; margin-top: 20px; width: 200px; }
        .progress-bar { height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: #ffcc00; width: 0%; transition: width 0.3s ease; }
        #progress-text { font-size: 12px; color: #8a8ab0; margin-top: 8px; }
    </style>
</head>
<body>

<div id="status-overlay">
    <div class="spinner" id="loader"></div>
    <h2 id="status-txt">Initializing Feedback Matrix...</h2>
    <p style="color: #8a8ab0; font-size: 14px; max-width: 280px; margin: 8px 0 0 0;" id="status-desc">Linking neon hand skeleton pipelines and wheel transforms.</p>
    <div id="loading-progress">
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div id="progress-text">Ready to start...</div>
    </div>
    <button id="btn-start">START RACING</button>
</div>

<div id="hud">
    <div class="hud-card">
        <div class="label">Speed</div>
        <div class="value"><span id="speedVal">0</span> KM/H</div>
    </div>
    <div class="hud-card">
        <div class="label">Distance</div>
        <div class="value" id="distanceVal">0 m</div>
    </div>
    <div class="hud-card">
        <div class="label">Input Tracking</div>
        <div class="value" id="steerLabel" style="font-size: 14px; margin-top: 5px; color: #00ffcc;">CENTER</div>
    </div>
</div>

<div id="controls">
    <div class="btn" id="btn-brake">🛑<br>BRAKE</div>
    <div class="btn" id="btn-gas">⚡<br>GAS</div>
</div>

<div id="cam-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay-canvas"></canvas>
</div>

<canvas id="canvas3d"></canvas>

<script>
    // IndexedDB for Model Caching
    const DB_NAME = 'racingGameModels';
    const STORE_NAME = 'models';
    
    let db = null;
    
    async function initDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => {
                db = request.result;
                resolve(db);
            };
            request.onupgradeneeded = (e) => {
                const newDB = e.target.result;
                if (!newDB.objectStoreNames.contains(STORE_NAME)) {
                    newDB.createObjectStore(STORE_NAME);
                }
            };
        });
    }
    
    async function getCachedModel(key) {
        if (!db) return null;
        return new Promise((resolve) => {
            const transaction = db.transaction([STORE_NAME], 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.get(key);
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => resolve(null);
        });
    }
    
    async function cacheModel(key, data) {
        if (!db) return;
        return new Promise((resolve) => {
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.put(data, key);
            request.onsuccess = () => resolve();
        });
    }

    const canvas = document.getElementById('canvas3d');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('webcam');
    const overlayCanvas = document.getElementById('overlay-canvas');
    const oCtx = overlayCanvas.getContext('2d');
    
    const overlay = document.getElementById('status-overlay');
    const statusTxt = document.getElementById('status-txt');
    const statusDesc = document.getElementById('status-desc');
    const loader = document.getElementById('loader');
    const btnStart = document.getElementById('btn-start');
    const speedVal = document.getElementById('speedVal');
    const distanceVal = document.getElementById('distanceVal');
    const steerLabel = document.getElementById('steerLabel');
    const btnGas = document.getElementById('btn-gas');
    const btnBrake = document.getElementById('btn-brake');
    const progressBar = document.getElementById('progress-fill');
    const progressText = document.getElementById('progress-text');
    const loadingProgress = document.getElementById('loading-progress');

    const MOBILE_FRAME_SKIP = 2; 
    let frameCount = 0;

    let carX = 0;             
    let targetCarX = 0;       
    let visualWheelRotation = 0; 
    let currentSpeed = 90;    
    let targetSpeed = 90;
    let roadDistance = 0;
    let totalDistance = 0;
    let handTrackerModel = null;
    let isGameRunning = false;
    let isGamePaused = false;
    let modelsLoading = false;
    let modelsReady = false;

    let isPressingGas = false;
    let isPressingBrake = false;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    btnGas.addEventListener('touchstart', (e) => { e.preventDefault(); if (!isGamePaused) { isPressingGas = true; btnGas.classList.add('active'); } });
    btnGas.addEventListener('touchend', (e) => { e.preventDefault(); isPressingGas = false; btnGas.classList.remove('active'); });
    btnGas.addEventListener('mousedown', () => { if (!isGamePaused) { isPressingGas = true; btnGas.classList.add('active'); } });
    btnGas.addEventListener('mouseup', () => { isPressingGas = false; btnGas.classList.remove('active'); });
    
    btnBrake.addEventListener('touchstart', (e) => { e.preventDefault(); if (!isGamePaused) { isPressingBrake = true; btnBrake.classList.add('active'); } });
    btnBrake.addEventListener('touchend', (e) => { e.preventDefault(); isPressingBrake = false; btnBrake.classList.remove('active'); });
    btnBrake.addEventListener('mousedown', () => { if (!isGamePaused) { isPressingBrake = true; btnBrake.classList.add('active'); } });
    btnBrake.addEventListener('mouseup', () => { isPressingBrake = false; btnBrake.classList.remove('active'); });

    async function startMobileCamera() {
        try {
            const constraints = {
                video: { facingMode: "user", width: { ideal: 256 }, height: { ideal: 192 } },
                audio: false
            };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            return new Promise((resolve) => { 
                video.onloadedmetadata = () => { 
                    video.play(); 
                    overlayCanvas.width = video.videoWidth;
                    overlayCanvas.height = video.videoHeight;
                    resolve(video); 
                }; 
            });
        } catch (err) {
            statusTxt.innerText = "Camera Blocked";
            statusDesc.innerText = "Please unlock camera access";
            loader.style.display = "none";
            throw err;
        }
    }

    async function loadHandposeModel() {
        // Check if cached
        const cached = await getCachedModel('handpose');
        if (cached) {
            statusTxt.innerText = "Loading from Cache...";
            progressText.innerText = "Models restored from cache!";
            progressBar.style.width = '100%';
            return cached;
        }
        
        // Load fresh and cache
        modelsLoading = true;
        loadingProgress.style.display = 'block';
        statusTxt.innerText = "Downloading Models...";
        
        const model = await handpose.load();
        modelsReady = true;
        
        // Cache it
        await cacheModel('handpose', model);
        
        progressBar.style.width = '100%';
        progressText.innerText = "Models cached for faster loading next time!";
        
        return model;
    }

    async function initMobileAI() {
        try {
            await initDB();
            await startMobileCamera();
            
            statusTxt.innerText = "Preparing Engine...";
            await tf.ready();
            
            handTrackerModel = await loadHandposeModel();
            
            loader.style.display = "none";
            statusTxt.innerText = "Ready To Race!";
            statusDesc.innerText = "Watch the neon lines match your hand movement perfectly.";
            btnStart.style.display = "block";
            
            btnStart.addEventListener('click', () => {
                overlay.style.opacity = "0";
                setTimeout(() => { overlay.style.display = "none"; }, 500);
                isGameRunning = true;
                isGamePaused = false;
                totalDistance = 0;
                currentSpeed = 90;
                processWebcamLoop();
                gameLoop();
            });
        } catch (e) { 
            console.error(e);
            statusTxt.innerText = "Error Loading";
            statusDesc.innerText = "Please refresh the page";
        }
    }

    async function processWebcamLoop() {
        if (!isGameRunning) return;
        frameCount++;

        if (frameCount % MOBILE_FRAME_SKIP === 0 && !isGamePaused) {
            try {
                const handsDetected = await handTrackerModel.estimateHands(video);
                oCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

                if (handsDetected.length >= 1) {
                    const hand = handsDetected[0];
                    const landmarks = hand.landmarks;
                    
                    // NEON SKELETON LAYER
                    const wrist = landmarks[0];
                    const indexBase = landmarks[5];
                    const pinkyBase = landmarks[17];
                    const middleTip = landmarks[12];
                    
                    // Draw neon palm base
                    oCtx.strokeStyle = '#00ffcc';
                    oCtx.lineWidth = 2;
                    oCtx.shadowColor = '#00ffcc';
                    oCtx.shadowBlur = 5;
                    
                    oCtx.beginPath();
                    oCtx.moveTo(wrist[0], wrist[1]);
                    oCtx.lineTo(indexBase[0], indexBase[1]);
                    oCtx.lineTo(pinkyBase[0], pinkyBase[1]);
                    oCtx.closePath();
                    oCtx.stroke();
                    
                    // Draw core directional bone
                    oCtx.strokeStyle = '#ff3366';
                    oCtx.shadowColor = '#ff3366';
                    oCtx.beginPath();
                    oCtx.moveTo(wrist[0], wrist[1]);
                    oCtx.lineTo(middleTip[0], middleTip[1]);
                    oCtx.stroke();
                    oCtx.shadowBlur = 0;

                    // Geometric steering angle
                    const dx = middleTip[0] - wrist[0];
                    const dy = middleTip[1] - wrist[1];
                    let angle = Math.atan2(dx, -dy);
                    
                    if (Math.abs(angle) < 0.08) angle = 0;
                    visualWheelRotation = angle * 1.5;
                    targetCarX = -angle * 320;

                    if (targetCarX > 30) {
                        steerLabel.innerText = "◀ LEFT";
                        steerLabel.style.color = "#ff3366";
                    } else if (targetCarX < -30) {
                        steerLabel.innerText = "RIGHT ▶";
                        steerLabel.style.color = "#00ffcc";
                    } else {
                        steerLabel.innerText = "● CENTER ●";
                        steerLabel.style.color = "#ffffff";
                    }
                } else {
                    visualWheelRotation += (0 - visualWheelRotation) * 0.1;
                    targetCarX += (0 - targetCarX) * 0.1;
                }
            } catch (err) {}
        }
        requestAnimationFrame(processWebcamLoop);
    }

    function drawCyberCar(ctx, x, y, width) {
        const height = width * 0.5;
        ctx.save();
        ctx.translate(x, y);

        ctx.fillStyle = 'rgba(0, 255, 204, 0.25)';
        ctx.shadowColor = '#00ffcc';
        ctx.shadowBlur = 15;
        ctx.fillRect(-width/2 - 10, height - 5, width + 20, 15);
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#ffcc00';
        ctx.shadowColor = '#ffcc00';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.moveTo(-width/2, height * 0.3);
        ctx.lineTo(-width/2 + 10, -height * 0.2);
        ctx.lineTo(width/2 - 10, -height * 0.2);
        ctx.lineTo(width/2, height * 0.3);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#00ffff';
        ctx.fillRect(-width/3, -height * 0.15, width/3, height * 0.2);
        ctx.fillRect(0, -height * 0.15, width/3, height * 0.2);

        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(-width/3, height * 0.25, width * 0.12, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(width/3, height * 0.25, width * 0.12, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#ff3366';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(-width/3, height * 0.25, width * 0.08, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(width/3, height * 0.25, width * 0.08, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
    }

    function renderRacetrack() {
        const w = canvas.width;
        const h = canvas.height;
        const horizon = h * 0.45;

        ctx.fillStyle = '#060612';
        ctx.fillRect(0, 0, w, h);

        if (isGameRunning && !isGamePaused) {
            carX += (targetCarX - carX) * 0.12;
            
            if (isPressingGas) {
                targetSpeed = Math.min(targetSpeed + 5, 250);
            } else if (isPressingBrake) {
                targetSpeed = Math.max(targetSpeed - 8, 50);
            } else {
                targetSpeed = 120;
            }
            
            currentSpeed += (targetSpeed - currentSpeed) * 0.08;
            roadDistance += currentSpeed * 0.04;
            totalDistance += currentSpeed * 0.04;
            
            speedVal.innerText = Math.floor(currentSpeed);
            distanceVal.innerText = Math.floor(totalDistance) + ' m';
        }

        const segments = 22;
        for (let i = segments; i > 0; i--) {
            let z = i / segments;
            let nextZ = (i - 1) / segments;

            let y1 = horizon + (1 - z) * (h - horizon);
            let y2 = horizon + (1 - nextZ) * (h - horizon);

            let projectionScale1 = (1 - z);
            let projectionScale2 = (1 - nextZ);

            let curveOffset = Math.sin((roadDistance * 0.008) + (z * 2.2)) * 70;
            let nextCurveOffset = Math.sin((roadDistance * 0.008) + (nextZ * 2.2)) * 70;

            let roadWidth1 = (w * 0.38) * projectionScale1 + 15;
            let roadWidth2 = (w * 0.38) * projectionScale2 + 15;

            let centerX1 = w / 2 + curveOffset + (carX * projectionScale1);
            let centerX2 = w / 2 + nextCurveOffset + (carX * projectionScale2);

            if (Math.floor(roadDistance + i) % 2 === 0) {
                ctx.fillStyle = 'rgba(25, 18, 56, 0.4)';
                ctx.beginPath();
                ctx.moveTo(centerX1 - roadWidth1, y1);
                ctx.lineTo(centerX1 + roadWidth1, y1);
                ctx.lineTo(centerX2 + roadWidth2, y2);
                ctx.lineTo(centerX2 - roadWidth2, y2);
                ctx.fill();

                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 3 * projectionScale1 + 0.5;
                ctx.beginPath(); 
                ctx.moveTo(centerX1 - roadWidth1, y1); 
                ctx.lineTo(centerX2 - roadWidth2, y2); 
                ctx.stroke();
                ctx.strokeStyle = '#ff3366';
                ctx.beginPath(); 
                ctx.moveTo(centerX1 + roadWidth1, y1); 
                ctx.lineTo(centerX2 + roadWidth2, y2); 
                ctx.stroke();
            }
        }

        const carW = w * 0.24 > 110 ? 110 : w * 0.24;
        const playerX = w / 2 - carW / 2;
        const playerY = h * 0.78;

        drawCyberCar(ctx, playerX, playerY, carW);
    }

    function gameLoop() {
        renderRacetrack();
        if (isGameRunning) {
            requestAnimationFrame(gameLoop);
        }
    }

    initMobileAI();
</script>

</body>
</html>
